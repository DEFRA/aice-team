name: Sync style guides to plugin resources

on:
  push:
    branches:
      - main
    paths:
      - 'style-guides/**'

permissions:
  contents: write

jobs:
  sync:
    name: Copy style guides into plugin resources
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Copy style guides to plugin resources
        run: |
          cp style-guides/python.md         plugins/python/resources/python.md
          cp style-guides/javascript.md     plugins/javascript/resources/javascript.md
          cp style-guides/github-actions.md plugins/github-actions/resources/github-actions.md

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && git diff --staged --quiet || (
            git add plugins/python/resources/python.md \
                    plugins/javascript/resources/javascript.md \
                    plugins/github-actions/resources/github-actions.md
            git commit -m "chore: sync plugin resources from style-guides [skip ci]"
            git push
          )
